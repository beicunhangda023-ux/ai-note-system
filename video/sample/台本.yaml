# サンプル台本。絵はお試し用の仮キャラです。自分の絵に差し替えて使ってください。
# 書き方の説明は video/README.md にあります。

設定:
  サイズ: 横            # 横・縦・正方形
  切り替え色: "#E04E36"

シーン:
  - 秒: 3
    絵: 絵/驚き.png
    テロップ:
      - 文字: AI副業
        種類: タグ
        大きさ: 小
        位置: 左上
      - 文字: "AIで文章は書けるのに…\n【何から始める？】"
        大きさ: 大
        位置: [4, 22]
        から: 0.3

  - 秒: 3.5
    絵: 絵/ふつう.png
    口パク: 絵/ふつう_口.png
    テロップ:
      - 文字: "AIで記事を\n／【作れる】\n／ようになった！"
        大きさ: 大
        位置: 左
        間: 0.5

  - 秒: 3.5
    絵: 絵/驚き.png
    口パク: 絵/驚き_口.png
    セリフ:
      - 名前: わたし
        文字: "でも、書いた記事が\n／【誰にも読まれない】…"
        から: 0.2
        間: 1.0

  - 秒: 4
    切り替え: ワイプ
    絵: 絵/笑顔.png
    口パク: 絵/笑顔_口.png
    ズーム: true
    テロップ:
      - 文字: "まずは、\n／【誰に】、\n／何を届けるか。"
        大きさ: 大
        位置: 左
        から: 0.5
        間: 0.6
        口パク: true

  - 秒: 4
    切り替え: フェード
    絵: 絵/ふつう.png
    画像:
      - ファイル: 絵/見本.png
        幅: 42
        位置: [4, 18]
        から: 0.2
    テロップ:
      - 文字: ① 小さな見本
        種類: タグ
        大きさ: 小
        位置: 左上
      - 文字: 見本を【1本】つくる。
        位置: 下
        から: 1.2

  - 秒: 4.5
    絵:
      - から: 0
        絵: 絵/ふつう.png
        口パク: 絵/ふつう_口.png
      - から: 2.4
        絵: 絵/笑顔.png
    セリフ:
      - 名前: わたし
        文字: 最初は、／【身近な一人】から。
        間: 0.7
    テロップ:
      - 文字: 誰の困りごとなら、【想像できそう】ですか？
        位置: 下
        大きさ: 小
        から: 1.8
